<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --c-bg: #f8f8f6;
    --c-surface: #ffffff;
    --c-border: #e4e4e0;
    --c-text: #1a1a18;
    --c-muted: #6b6b68;
    --c-accent: #2563eb;
    --c-accent-bg: #eff6ff;
    --c-danger: #dc2626;
    --c-success: #16a34a;
    --c-success-bg: #f0fdf4;
    --radius: 10px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--c-bg); color: var(--c-text); min-height: 100vh; font-size: 16px; line-height: 1.5; }

  .topbar { background: var(--c-surface); border-bottom: 1px solid var(--c-border); padding: 0 1.25rem; height: 52px; display: flex; align-items: center; position: sticky; top: 0; z-index: 10; }
  .topbar-logo { font-size: 16px; font-weight: 600; }

  .wrap { max-width: 640px; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  .card { background: var(--c-surface); border: 1px solid var(--c-border); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .deal-from { font-size: 14px; color: var(--c-muted); margin-bottom: 1rem; }
  .deal-from b { color: var(--c-text); }

  .msg { font-size: 13px; padding: 0.6rem 0.85rem; border-radius: 8px; margin-bottom: 0.75rem; display: none; }
  .msg.error { background: #fef2f2; color: var(--c-danger); border: 1px solid #fecaca; display: block; }
  .msg.info { background: var(--c-accent-bg); color: var(--c-accent); border: 1px solid #bfdbfe; display: block; }
  .msg.success { background: var(--c-success-bg); color: var(--c-success); border: 1px solid #bbf7d0; display: block; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; padding: 0.7rem 1rem; border-radius: var(--radius); border: 1px solid var(--c-border); background: var(--c-surface); font-size: 15px; cursor: pointer; transition: background .15s; font-family: inherit; color: var(--c-text); }
  .btn:hover { background: var(--c-bg); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--c-accent); color: #fff; border-color: var(--c-accent); }
  .btn-primary:hover:not(:disabled) { background: #1d4ed8; border-color: #1d4ed8; }

  .upload-label { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; padding: 0.75rem 1rem; border-radius: var(--radius); border: 1.5px dashed var(--c-border); background: var(--c-bg); font-size: 15px; cursor: pointer; transition: border-color .15s, background .15s; color: var(--c-muted); }
  .upload-label:hover { border-color: var(--c-accent); background: var(--c-accent-bg); color: var(--c-accent); }

  .sig-grid { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }

<script type="module">
  import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
  pdfjsLib.GlobalWorkerOptions.workerSrc =

<body>

<div class="topbar"><div class="topbar-logo">SignFinder</div></div>

<div class="wrap" id="app">
  <div class="center-screen" id="screen-loading">Загрузка…</div>
</div>

<script>
const SHARE_TOKEN = window.location.pathname.split('/sign/')[1]?.replace(/\/$/, '') || '';
let _deal = null;
let _processedSigB64 = null;
let _activeTab = 'camera';
let _drawing = false;
let _canvasHasInk = false;
let _canvasInitialized = false;

function apiFetch(path, opts = {}) {
  return fetch('/api' + path, opts);
}

function el(id) { return document.getElementById(id); }

function showError(text) {
  el('app').innerHTML = `<div class="center-screen">⚠️ ${text}</div>`;
}

async function init() {
  if (!SHARE_TOKEN) {
    showError('Неверная ссылка.');
    return;
  }
  let res;
  try {
    res = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}`);
  } catch {
    showError('Нет связи с сервером. Обновите страницу.');
    return;
  }
  if (res.status === 404) {
    showError('Ссылка недействительна или сделка удалена.');
    return;
  }
  if (res.status === 429) {
    showError('Слишком много попыток. Попробуйте через минуту.');
    return;
  }
  if (!res.ok) {
    showError('Не удалось загрузить сделку.');
    return;
  }
  _deal = await res.json();
  renderScreen();
  loadPdf();
}

function renderScreen() {
  const expires = new Date(_deal.expires_at);
  const expiresStr = expires.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });

  const signedBadge = _deal.status === 'signed'
    ? `<div class="badge-signed">✓ Договор подписан</div>`
    : '';

  const downloadBtn = _deal.has_final_pdf
    ? `<button class="btn btn-primary" onclick="downloadFinal()">Скачать финальный PDF</button>`
    : '';

  const signingForm = (_deal.status === 'signed') ? '' : renderSigningForm();

  el('app').innerHTML = `
    <div class="card">
      <div class="deal-from">Договор от <b>${escapeHtml(_deal.initiator_email)}</b> на подпись</div>
      ${signedBadge}
      <div class="pdf-panel">
        <div class="pdf-scroll" id="pdf-scroll"><div class="pdf-empty">Загрузка документа…</div></div>
      </div>
      ${downloadBtn}
    </div>
    ${signingForm}
    <div class="footer-note">
      powered by SignFinder · Ссылка действует до ${expiresStr}<br>
      <a href="/pep-agreement" target="_blank">Соглашение об ПЭП</a> ·
      <a href="/terms" target="_blank">Оферта</a> ·
      <a href="/privacy" target="_blank">Конфиденциальность</a> ·
      <a href="/cookies" target="_blank">Cookies</a>
    </div>
  `;

  if (_deal.status !== 'signed') {
    wireSigningForm();
  }
}

function renderSigningForm() {
  return `
    <div class="card" id="sign-card">
      <div id="sign-msg" class="msg"></div>

      <div class="disclaimer">
        ⓘ Подписывая ниже, вы ставите простую электронную подпись (ПЭП) — она
        юридически равнозначна собственноручной подписи на бумаге при
        согласии обеих сторон.
      </div>
      <label class="consent-row">
        <input type="checkbox" id="consent-pep">
        Я согласен, что моя подпись, поставленная в этом документе, является
        простой электронной подписью в понимании ст. 5 ФЗ-63, и признаю её
        равнозначной собственноручной подписи на бумажном документе.
      </label>

      <div style="font-size:14px;font-weight:600;margin:1rem 0 0.5rem">Ваша подпись</div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-btn-camera" onclick="switchTab('camera')">📷 Фото</button>
        <button class="tab-btn" id="tab-btn-file" onclick="switchTab('file')">📁 Файл</button>
        <button class="tab-btn" id="tab-btn-canvas" onclick="switchTab('canvas')">✏️ Нарисовать</button>
      </div>

      <div class="tab-panel active" id="tab-camera">
        <label class="upload-label">
          📷 Сделать фото подписи
          <input type="file" id="inp-camera" accept="image/*" capture="environment" style="display:none">
        </label>
        <div class="hint">Подпись на белом листе, хорошее освещение.</div>
      </div>

      <div class="tab-panel" id="tab-file">
        <label class="upload-label">
          📁 Выбрать файл
          <input type="file" id="inp-file" accept="image/*" style="display:none">
        </label>
        <div class="hint">PNG или JPG с уже отсканированной подписью.</div>
      </div>

      <div class="tab-panel" id="tab-canvas">
        <canvas id="sign-canvas"></canvas>
        <div class="hint">Нарисуйте подпись пальцем или мышью.</div>
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
          <button class="btn" onclick="clearCanvas()" type="button">Очистить</button>
          <button class="btn" onclick="useCanvasSignature()" type="button">Готово</button>
        </div>
      </div>

      <div id="sig-processing" style="display:none;text-align:center;color:var(--c-muted);font-size:14px;padding:0.5rem 0">⏳ Обработка…</div>

      <div id="sig-preview" style="display:none">
        <div class="sig-grid">
          <div class="sig-col">
            <div class="sig-col-label">Оригинал</div>
            <img id="sig-original" class="sig-img">
          </div>
          <div class="sig-col">
            <div class="sig-col-label">После обработки</div>
            <img id="sig-processed" class="sig-img sig-img-processed">
          </div>
        </div>
        <div id="sig-meta" class="sig-meta"></div>
      </div>

      <button class="btn btn-primary" id="btn-sign" onclick="doSign()" disabled style="margin-top:0.5rem">Подписать</button>
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ── PDF viewer ──────────────────────────────────────────────────────────────

async function loadPdf() {
  let res;
  try {
    res = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}/pdf`);
  } catch {
    return;
  }
  if (!res.ok) return;
  const blob = await res.blob();
  renderPdf(blob);
}

async function renderPdf(blob) {
  const scrollEl = el('pdf-scroll');
  if (!scrollEl || !window._pdfjsLib) return;

  const arrayBuffer = await blob.arrayBuffer();
  const pdf = await window._pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const containerWidth = scrollEl.clientWidth - 24;
  const dpr = window.devicePixelRatio || 1;

  const fragment = document.createDocumentFragment();
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({ scale: 1 });
    const scale = Math.min(containerWidth / baseViewport.width, 1.6);
    const viewport = page.getViewport({ scale: scale * dpr });

    const canvas = document.createElement('canvas');
    canvas.className = 'pdf-page';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvas.style.width = (viewport.width / dpr) + 'px';
    canvas.style.height = (viewport.height / dpr) + 'px';
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    fragment.appendChild(canvas);
  }
  scrollEl.replaceChildren(fragment);
}

// ── Signature tabs ──────────────────────────────────────────────────────────

window.switchTab = (tab) => {
  _activeTab = tab;
  for (const t of ['camera', 'file', 'canvas']) {
    el(`tab-btn-${t}`).classList.toggle('active', t === tab);
    el(`tab-${t}`).classList.toggle('active', t === tab);
  }
  // fix16: canvas is display:none until this tab is picked, so it can only
  // be measured/sized once it's actually visible — see sizeCanvas().
  if (tab === 'canvas') sizeCanvas();
};

function wireSigningForm() {
  el('consent-pep').addEventListener('change', updateSignButtonState);
  el('inp-camera').addEventListener('change', (e) => onSignatureFile(e.target.files[0]));
  el('inp-file').addEventListener('change', (e) => onSignatureFile(e.target.files[0]));
  wireCanvasEvents();
}

function updateSignButtonState() {
  const btn = el('btn-sign');
  if (!btn) return;
  btn.disabled = !(el('consent-pep').checked && _processedSigB64);
}

async function onSignatureFile(file) {
  if (!file) return;
  el('sig-original').src = URL.createObjectURL(file);
  el('sig-preview').style.display = 'none';
  el('sig-processing').style.display = 'block';
  _processedSigB64 = null;
  updateSignButtonState();

  const fd = new FormData();
  fd.append('file', file);
  let res;
  try {
    res = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}/signature/preview`, { method: 'POST', body: fd });
  } catch {
    el('sig-processing').style.display = 'none';
    showSignMsg('Ошибка соединения', 'error');
    return;
  }
  el('sig-processing').style.display = 'none';
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showSignMsg(err.detail || 'Не удалось обработать подпись', 'error');
    return;
  }
  const data = await res.json();
  applyProcessedSignature(data);
}

function applyProcessedSignature(data) {
  _processedSigB64 = data.processed_png_b64;
  el('sig-processed').src = 'data:image/png;base64,' + data.processed_png_b64;
  el('sig-preview').style.display = 'block';
  const pct = Math.round((data.confidence || 0) * 100);
  const warns = (data.warnings || []).length ? ('⚠️ ' + data.warnings.join('; ')) : '✓ Обработка успешна';
  el('sig-meta').textContent = `Качество: ${pct}% · ${warns}`;
  updateSignButtonState();
}

// ── Canvas drawing (mouse + touch/pointer) ──────────────────────────────────

// fix16: canvas has display:none until the "Нарисовать" tab is picked, and
// a hidden element's getBoundingClientRect() is always 0x0 — sizing had to
// be split out from event wiring (which doesn't care about visibility) and
// deferred until the tab actually shows the canvas. Guarded by
// _canvasInitialized so switching tabs back and forth doesn't reset (and
// erase) an already-sized, already-drawn-on canvas.
function sizeCanvas() {
  const canvas = el('sign-canvas');
  if (!canvas || _canvasInitialized) return;
  const rect = canvas.getBoundingClientRect();
  if (rect.width === 0 || rect.height === 0) return;  // still hidden
  const dpr = window.devicePixelRatio || 1;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#1a1a18';
  _canvasInitialized = true;
}

function wireCanvasEvents() {
  const canvas = el('sign-canvas');
  if (!canvas) return;

  let last = null;

  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };

  canvas.addEventListener('pointerdown', (e) => {
    _drawing = true;
    canvas.setPointerCapture(e.pointerId);
    last = pos(e);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!_drawing) return;
    const p = pos(e);
    const ctx = canvas.getContext('2d');
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    last = p;
    _canvasHasInk = true;
  });
  const stop = () => { _drawing = false; };
  canvas.addEventListener('pointerup', stop);
  canvas.addEventListener('pointerleave', stop);
  canvas.addEventListener('pointercancel', stop);
}

window.clearCanvas = () => {
  const canvas = el('sign-canvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  _canvasHasInk = false;
};

window.useCanvasSignature = async () => {
  if (!_canvasHasInk) {
    showSignMsg('Сначала нарисуйте подпись', 'error');
    return;
  }
  const canvas = el('sign-canvas');
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
  el('sig-original').src = URL.createObjectURL(blob);
  el('sig-preview').style.display = 'none';
  el('sig-processing').style.display = 'block';
  _processedSigB64 = null;
  updateSignButtonState();

  const fd = new FormData();
  fd.append('file', blob, 'signature.png');
  let res;
  try {
    res = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}/signature/preview`, { method: 'POST', body: fd });
  } catch {
    el('sig-processing').style.display = 'none';
    showSignMsg('Ошибка соединения', 'error');
    return;
  }
  el('sig-processing').style.display = 'none';
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showSignMsg(err.detail || 'Не удалось обработать подпись', 'error');
    return;
  }
  applyProcessedSignature(await res.json());
};

function showSignMsg(text, kind) {
  const m = el('sign-msg');
  if (!m) return;
  m.textContent = text;
  m.className = 'msg ' + kind;
}

// ── Sign ──────────────────────────────────────────────────────────────────

window.doSign = async () => {
  const btn = el('btn-sign');
  btn.disabled = true;
  btn.textContent = 'Подписание…';

  const sourceMap = { camera: 'camera', file: 'file', canvas: 'canvas' };
  let res;
  try {
    res = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}/sign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        signature_png_b64: _processedSigB64,
        consent_pep: el('consent-pep').checked,
        signature_source: sourceMap[_activeTab],
      }),
    });
  } catch {
    btn.disabled = false;
    btn.textContent = 'Подписать';
    showSignMsg('Ошибка соединения', 'error');
    return;
  }

  if (res.status === 409) {
    showSignMsg('Эта сделка уже подписана. Обновите страницу.', 'error');
    btn.textContent = 'Подписать';
    return;
  }
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    showSignMsg(err.detail || 'Не удалось подписать', 'error');
    btn.disabled = false;
    btn.textContent = 'Подписать';
    return;
  }

  // Re-fetch deal state and re-render as "signed"
  const r2 = await apiFetch(`/v1/public/deals/${SHARE_TOKEN}`);
  _deal = await r2.json();
  renderScreen();
  loadPdf();
};
